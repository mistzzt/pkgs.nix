name: Repair One Package
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: repair-${{ inputs.package }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  REPAIR_PACKAGE: ${{ inputs.package }}

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
      started: ${{ steps.prepare.outputs.started }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: automation
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Prepare failure evidence and check for an existing repair
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: python3 automation/scripts/ci_repair.py prepare
      - uses: cachix/install-nix-action@v31
        if: steps.prepare.outputs.started == 'true'
        with:
          set_as_trusted_user: false
      - name: Investigate and propose a patch
        id: codex
        if: steps.prepare.outputs.started == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: candidate
          prompt-file: ${{ github.workspace }}/automation/.github/codex/repair.md
          output-schema-file: ${{ github.workspace }}/automation/.github/codex/repair-schema.json
          # Nix needs network access and access to its store and daemon.
          sandbox: danger-full-access
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_REPAIR_MODEL }}
          allow-users: ${{ github.actor }}

  verify:
    needs: investigate
    if: always() && needs.investigate.outputs.started == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.verify.outputs.changed }}
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: automation
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: candidate
      - uses: cachix/install-nix-action@v31
        with:
          set_as_trusted_user: false
      - name: Validate patch and build independently
        id: verify
        env:
          REPAIR_RESULT: ${{ needs.investigate.outputs.result }}
        run: python3 automation/scripts/ci_repair.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repair-${{ inputs.package }}
          path: repair-output/
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: automation
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repair-${{ inputs.package }}
          path: repair-output
      - name: Revalidate patch before granting write access
        run: python3 automation/scripts/ci_repair.py apply
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open repair PR for human review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPAIR_VERIFIED: ${{ needs.verify.outputs.verified }}
        run: python3 automation/scripts/ci_repair.py publish
