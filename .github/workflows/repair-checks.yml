name: Check CI Repair
on:
  pull_request:
    paths:
      - .github/workflows/repair*.yml
      - .github/codex/**
      - scripts/ci_repair.py
      - scripts/tests/test_ci_repair.py
  push:
    branches: [main]
    paths:
      - .github/workflows/repair*.yml
      - .github/codex/**
      - scripts/ci_repair.py
      - scripts/tests/test_ci_repair.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#actionlint -- .github/workflows/repair*.yml
