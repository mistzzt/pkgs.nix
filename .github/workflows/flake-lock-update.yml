name: Update flake.lock
on:
  schedule:
    - cron: "17 5 * * 1,4" # Monday and Thursday at 5:17 AM UTC
  workflow_dispatch:

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: cachix/install-nix-action@v31

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/flake-lock
          pr-title: "flake: update flake.lock"
          pr-labels: |
            dependencies
            automated

      - name: Merge after package builds pass
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
        run: |
          # Wait for build.yml to register its check runs on the PR
          for _ in $(seq 30); do
            count=$(gh pr checks "$PR" --json name --jq 'length' 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && break
            sleep 10
          done
          if [ "$count" -eq 0 ]; then
            echo "No checks appeared on PR #$PR; refusing to merge" >&2
            exit 1
          fi

          gh pr checks "$PR" --watch --fail-fast
          gh pr merge "$PR" --squash
