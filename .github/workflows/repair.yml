name: Repair CI Failures
on:
  workflow_run:
    workflows: [Update Packages, Build Packages]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  discover:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_repair.py discover

  repair:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    uses: ./.github/workflows/repair-package.yml
    with:
      package: ${{ matrix.package }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
